<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .pdf-container {
            width: 100%;
            height: 100vh; /* 80% of the viewport height */
            margin: 20px auto;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>My PDF Document</h1>

    <div class="pdf-container">
        <iframe src="CockpitLayout.pdf">
            <p>Your browser does not support iframes. You can <a href="your-document.pdf">download the PDF</a> instead.</p>
        </iframe>
    </div>

</body>
</html>
