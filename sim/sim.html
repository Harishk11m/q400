<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Toggle Switches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="control-group">
        <div class="toggle-switch" id="switch-1">
            <div class="lever"></div>
        </div>
        <label>RECIRC</label>
    </div>

    <div class="control-group">
        <div class="toggle-switch" id="switch-2">
            <div class="lever"></div>
        </div>
        <label>BLEED 1</label>
    </div>

    <div class="control-group">
        <div class="toggle-switch" id="switch-3">
            <div class="lever"></div>
        </div>
        <label>BLEED 2</label>
    </div>

    <script src="script.js"></script>
</body>
</html>
